<div class="page-header">
  <div>
    <h1>Trabajadores</h1>
    <p>Administra las cuentas de vendedores, pickers y repartidores</p>
  </div>
  <button pButton icon="pi pi-plus" label="Nuevo trabajador" (click)="abrirNuevo()"></button>
</div>

<p-table
  [value]="usuarios()"
  [loading]="cargando()"
  [paginator]="true"
  [rows]="10"
  styleClass="p-datatable-sm"
  responsiveLayout="scroll">

  <ng-template pTemplate="header">
    <tr>
      <th>Nombre</th>
      <th>Usuario</th>
      <th>Rol</th>
      <th>Estado</th>
      <th style="width: 120px">Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-usuario>
    <tr>
      <td>{{ usuario.nombre }}</td>
      <td>{{ usuario.username }}</td>
      <td><p-tag [value]="usuario.rol" severity="info"></p-tag></td>
      <td>
        <p-tag
          [value]="usuario.activo ? 'Activo' : 'Inactivo'"
          [severity]="usuario.activo ? 'success' : 'danger'">
        </p-tag>
      </td>
      <td>
        <button pButton icon="pi pi-pencil" class="p-button-text p-button-rounded" pTooltip="Editar" (click)="abrirEdicion(usuario)"></button>
        @if (usuario.activo) {
          <button pButton icon="pi pi-trash" class="p-button-text p-button-rounded p-button-danger" pTooltip="Desactivar" (click)="desactivar(usuario)"></button>
        } @else {
          <button pButton icon="pi pi-refresh" class="p-button-text p-button-rounded p-button-success" pTooltip="Reactivar" (click)="reactivar(usuario)"></button>
        }
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5" style="text-align: center; padding: 2rem;">No hay trabajadores registrados</td>
    </tr>
  </ng-template>

</p-table>

<p-dialog
  [(visible)]="dialogoVisible"
  [header]="modoEdicion() ? 'Editar trabajador' : 'Nuevo trabajador'"
  [modal]="true"
  [style]="{ width: '420px' }">

  <form [formGroup]="formulario" class="form-dialogo">

    <div class="campo">
      <label for="rol">Rol</label>
      <p-dropdown
        id="rol"
        formControlName="rolId"
        [options]="roles()"
        optionLabel="nombre"
        optionValue="id"
        placeholder="Selecciona un rol"
        styleClass="w-full">
      </p-dropdown>
    </div>

    <div class="campo">
      <label for="nombre">Nombre completo</label>
      <input pInputText id="nombre" formControlName="nombre" placeholder="Ej: Carlos Ramírez" />
    </div>

    <div class="campo">
      <label for="username">Usuario (para iniciar sesión)</label>
      <input pInputText id="username" formControlName="username" placeholder="Ej: carlos.picker" />
    </div>

    <div class="campo">
      <label for="email">Correo (opcional, para enviarle bienvenida)</label>
      <input pInputText id="email" formControlName="email" placeholder="trabajador@correo.com" />
    </div>

    <div class="campo">
      <label for="password">{{ modoEdicion() ? 'Nueva contraseña (opcional)' : 'Contraseña' }}</label>
      <p-password
        id="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        [placeholder]="modoEdicion() ? 'Dejar vacío para no cambiarla' : 'Mínimo 6 caracteres'"
        styleClass="w-full"
        inputStyleClass="w-full">
      </p-password>
    </div>

  </form>

  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" class="p-button-text" (click)="dialogoVisible.set(false)"></button>
    <button pButton label="Guardar" [loading]="guardando()" (click)="guardar()"></button>
  </ng-template>

</p-dialog>
