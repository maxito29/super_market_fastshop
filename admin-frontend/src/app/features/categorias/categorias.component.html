<div class="page-header">
  <div>
    <h1>Categorías</h1>
    <p>Administra las categorías de productos del supermercado</p>
  </div>
  <button pButton icon="pi pi-plus" label="Nueva categoría" (click)="abrirNueva()"></button>
</div>

<p-table
  [value]="categorias()"
  [loading]="cargando()"
  [paginator]="true"
  [rows]="10"
  styleClass="p-datatable-sm"
  responsiveLayout="scroll">

  <ng-template pTemplate="header">
    <tr>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Estado</th>
      <th style="width: 120px">Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-categoria>
    <tr>
      <td>{{ categoria.nombre }}</td>
      <td>{{ categoria.descripcion || '—' }}</td>
      <td>
        <p-tag
          [value]="categoria.activo ? 'Activa' : 'Inactiva'"
          [severity]="categoria.activo ? 'success' : 'danger'">
        </p-tag>
      </td>
     <td>
        <button pButton icon="pi pi-pencil" class="p-button-text p-button-rounded" pTooltip="Editar" (click)="abrirEdicion(categoria)"></button>
        @if (categoria.activo) {
          <button pButton icon="pi pi-trash" class="p-button-text p-button-rounded p-button-danger" pTooltip="Desactivar" (click)="eliminar(categoria)"></button>
        } @else {
          <button pButton icon="pi pi-refresh" class="p-button-text p-button-rounded p-button-success" pTooltip="Reactivar" (click)="reactivar(categoria)"></button>
        }
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="4" style="text-align: center; padding: 2rem;">No hay categorías registradas</td>
    </tr>
  </ng-template>

</p-table>

<p-dialog
  [(visible)]="dialogoVisible"
  [header]="modoEdicion() ? 'Editar categoría' : 'Nueva categoría'"
  [modal]="true"
  [style]="{ width: '420px' }">

  <form [formGroup]="formulario" class="form-dialogo">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input pInputText id="nombre" formControlName="nombre" placeholder="Ej: Lácteos" />
    </div>

    <div class="campo">
      <label for="descripcion">Descripción</label>
      <input pInputText id="descripcion" formControlName="descripcion" placeholder="Opcional" />
    </div>
  </form>

  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" class="p-button-text" (click)="dialogoVisible.set(false)"></button>
    <button pButton label="Guardar" [loading]="guardando()" (click)="guardar()"></button>
  </ng-template>

</p-dialog>
