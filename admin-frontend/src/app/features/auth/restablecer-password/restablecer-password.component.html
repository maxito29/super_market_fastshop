<div class="auth-page">
  <div class="curved-shape"></div>
  <div class="curved-shape2"></div>

  <div class="auth-card">
    <div class="brand">
      <i class="pi pi-lock-open"></i>
      <h1>Nueva contraseña</h1>
      <p>Ingresa el código que recibiste por correo</p>
    </div>

    @if (!exito()) {
      <form [formGroup]="formulario" (ngSubmit)="onSubmit()">
        <div class="input-box">
          <input type="text" formControlName="token" required />
          <label>Código recibido</label>
          <i class="pi pi-hashtag"></i>
        </div>

        <div class="input-box">
          <input [type]="passwordVisible() ? 'text' : 'password'" formControlName="nuevaPassword" required />
          <label>Nueva contraseña</label>
          <i class="pi toggle-password" [class.pi-eye]="passwordVisible()" [class.pi-eye-slash]="!passwordVisible()" (click)="togglePassword()"></i>
        </div>

        @if (errorMensaje()) {
          <div class="error-msg">
            <i class="pi pi-exclamation-circle"></i>
            <span>{{ errorMensaje() }}</span>
          </div>
        }

        <button class="btn" type="submit" [disabled]="cargando()">
          @if (cargando()) {
            <i class="pi pi-spin pi-spinner"></i>
          } @else {
            Cambiar contraseña
          }
        </button>
      </form>
    } @else {
      <div class="mensaje-exito">
        <i class="pi pi-check-circle"></i>
        <p>Tu contraseña se actualizó correctamente. Te llevamos al login...</p>
      </div>
    }
  </div>
</div>
