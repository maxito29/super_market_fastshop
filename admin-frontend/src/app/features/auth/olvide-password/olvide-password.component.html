<div class="auth-page">
  <div class="curved-shape"></div>
  <div class="curved-shape2"></div>

  <div class="auth-card">
    <div class="brand">
      <i class="pi pi-key"></i>
      <h1>Recuperar contraseña</h1>
      <p>Te enviaremos un código a tu correo</p>
    </div>

    @if (!enviado()) {
      <form [formGroup]="formulario" (ngSubmit)="onSubmit()">
        <div class="input-box">
          <input type="email" formControlName="email" required />
          <label>Correo electrónico</label>
          <i class="pi pi-envelope"></i>
        </div>

        <button class="btn" type="submit" [disabled]="cargando()">
          @if (cargando()) {
            <i class="pi pi-spin pi-spinner"></i>
          } @else {
            Enviar código
          }
        </button>
      </form>
    } @else {
      <div class="mensaje-exito">
        <i class="pi pi-check-circle"></i>
        <p>Si tu correo está registrado, te llegará un código de recuperación en unos minutos.</p>
        <a routerLink="/restablecer-password" class="link-continuar">Ya tengo mi código →</a>
      </div>
    }

    <a routerLink="/login" class="volver-login"><i class="pi pi-arrow-left"></i> Volver al login</a>
  </div>
</div>
