<svg
  class="categoria-icono-svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  xmlns="http://www.w3.org/2000/svg"
  [ngSwitch]="tipo">

  <!-- Frutas y Verduras: hoja -->
  <ng-container *ngSwitchCase="'frutas'">
    <path d="M6 18c0-7 4-11 11-11 0 7-4 11-11 11Z" />
    <path d="M6 18c2-4 5-7 9-9" />
  </ng-container>

  <!-- Carnes, Aves y Pescados: pierna/muslo -->
  <ng-container *ngSwitchCase="'carnes'">
    <ellipse cx="10" cy="10" rx="5.4" ry="4.1" transform="rotate(-30 10 10)" />
    <path d="M13.6 13.4 18 17.8" />
    <circle cx="19" cy="19" r="1.8" />
  </ng-container>

  <!-- Desayunos: taza de café -->
  <ng-container *ngSwitchCase="'desayunos'">
    <path d="M5 9h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9Z" />
    <path d="M16 10.5h1.3a2.3 2.3 0 0 1 0 4.6H16" />
    <path d="M8.5 6c0-.9.9-1 .9-1.9M12 6c0-.9.9-1 .9-1.9" />
  </ng-container>

  <!-- Lácteos y Huevos: envase de leche -->
  <ng-container *ngSwitchCase="'lacteos'">
    <path d="M8.3 4h7.4l1 3.2V19a2 2 0 0 1-2 2h-5.4a2 2 0 0 1-2-2V7.2L8.3 4Z" />
    <path d="M9.3 8.2h5.4" />
    <path d="M9.6 4 12 6.3 14.4 4" />
  </ng-container>

  <!-- Quesos y Fiambres: cuña de queso -->
  <ng-container *ngSwitchCase="'quesos'">
    <path d="M4 7.5c6.5 0 11.5 5 11.5 11H4v-11Z" />
    <circle cx="8" cy="13.5" r="0.55" fill="currentColor" stroke="none" />
    <circle cx="10.8" cy="17" r="0.55" fill="currentColor" stroke="none" />
    <circle cx="6.7" cy="16.8" r="0.5" fill="currentColor" stroke="none" />
  </ng-container>

  <!-- Panadería y Pastelería: pan -->
  <ng-container *ngSwitchCase="'panaderia'">
    <path d="M4 13.2c0-4.1 3.6-7.2 8-7.2s8 3.1 8 7.2v2.8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.8Z" />
    <path d="M8.2 10.3v5M12 9.4v6M15.8 10.3v5" />
  </ng-container>

  <!-- Pollo Rostizado y Comidas Preparadas: bowl con vapor -->
  <ng-container *ngSwitchCase="'comidas-preparadas'">
    <path d="M4 11.5h16a8 8 0 0 1-16 0Z" />
    <path d="M4 11.5a8 8 0 0 1 16 0" />
    <path d="M9.5 6c0-.8.8-.9.8-1.7M14.5 6c0-.8.8-.9.8-1.7" />
  </ng-container>

  <!-- Bebidas: botella -->
  <ng-container *ngSwitchCase="'bebidas'">
    <path d="M10.2 3h3.6v2.7l1.7 2.4v11a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-11l1.7-2.4V3Z" />
    <path d="M9.5 12.5h5" />
  </ng-container>

  <!-- Snacks y Dulces: estrella -->
  <ng-container *ngSwitchCase="'snacks'">
    <path d="m12 4 2.1 4.4 4.9.7-3.5 3.5.8 4.9L12 15.3 7.7 17.5l.8-4.9-3.5-3.5 4.9-.7L12 4Z" stroke-linejoin="round" />
  </ng-container>

  <!-- Limpieza: rociador -->
  <ng-container *ngSwitchCase="'limpieza'">
    <path d="M8.7 21h6a1 1 0 0 0 1-1v-7.5H7.7V20a1 1 0 0 0 1 1Z" />
    <path d="M9.8 12.5V9h3.4v3.5" />
    <path d="M11 9V5.7h1.6" />
    <path d="M14.2 5.7h2M15 4.2l1.3 1.3M15 7.2l1.3-1.3" />
  </ng-container>

  <!-- Cuidado Personal: gota -->
  <ng-container *ngSwitchCase="'cuidado-personal'">
    <path d="M12 3c3.2 4.1 6 7.7 6 11.2a6 6 0 1 1-12 0C6 10.7 8.8 7.1 12 3Z" />
  </ng-container>

  <!-- Bebés: biberón -->
  <ng-container *ngSwitchCase="'bebes'">
    <path d="M9 11h5.4v1.6A1.8 1.8 0 0 1 16.2 14.4V19a2 2 0 0 1-2 2H9.8a2 2 0 0 1-2-2v-6.2A1.8 1.8 0 0 1 9 11Z" />
    <path d="M9.7 8.2h3.4L12.6 11h-2.3l-.6-2.8Z" />
    <path d="M8.6 16.2h6.5" />
  </ng-container>

  <!-- Mascotas: huella -->
  <ng-container *ngSwitchCase="'mascotas'">
    <circle cx="7.6" cy="9.4" r="1.5" />
    <circle cx="12" cy="7.2" r="1.5" />
    <circle cx="16.4" cy="9.4" r="1.5" />
    <ellipse cx="12" cy="15.2" rx="4.6" ry="3.6" />
  </ng-container>

  <!-- Congelados: copo de nieve -->
  <ng-container *ngSwitchCase="'congelados'">
    <path d="M12 3v18M4.4 7.5l15.2 9M4.4 16.5l15.2-9" />
  </ng-container>

  <!-- Abarrotes: bolsa -->
  <ng-container *ngSwitchCase="'abarrotes'">
    <path d="M6 8h12l-1.2 10.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 8Z" stroke-linejoin="round" />
    <path d="M9 8V6a3 3 0 0 1 6 0v2" />
    <path d="M8.6 11.5h6.8" />
  </ng-container>

  <!-- General: etiqueta (categorías sin palabra clave reconocida) -->
  <ng-container *ngSwitchDefault>
    <path d="M11 4h5.5a1.5 1.5 0 0 1 1.5 1.5V11l-8 8-8-8 8-8Z" stroke-linejoin="round" />
    <circle cx="14.5" cy="7.5" r="1.1" />
  </ng-container>

</svg>
