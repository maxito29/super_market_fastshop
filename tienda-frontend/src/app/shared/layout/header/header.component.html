<header class="encabezado">
  <div class="contenedor barra">
    
<div class="bloque-izquierdo">
  <button
    class="boton-menu"
    [class.activo]="menu.abierto()"
    aria-label="Menú principal"
    [attr.aria-expanded]="menu.abierto()"
    (click)="menu.toggle()">
    <span class="boton-menu-lineas">
      <span class="linea linea-1"></span>
      <span class="linea linea-2"></span>
      <span class="linea linea-3"></span>
    </span>
  </button>
      
<a routerLink="/" class="marca">
  <span class="marca-icono" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 8h12l-1.2 10.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M9 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M9.5 11.5 10 15M14.5 11.5 14 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </span>
  <span class="marca-nombre">
    <span class="marca-nombre-fast">Fast</span><span class="marca-nombre-shop">shop</span>
  </span>
</a>
    </div>

    <div class="bloque-busqueda" [class.panel-activo]="panelAbierto">
      <form class="buscador-form" role="search" (ngSubmit)="buscarAhora()">
        <p-iconField iconPosition="right">
          <p-inputIcon
            [styleClass]="textoBusqueda ? 'pi pi-times buscador-limpiar' : 'pi pi-search'"
            (click)="textoBusqueda ? limpiarBusqueda() : null">
          </p-inputIcon>
          <input
            type="text"
            pInputText
            name="busquedaProducto"
            placeholder="¿Qué estás buscando hoy?"
            class="buscador-input"
            aria-label="Buscar productos"
            autocomplete="off"
            [(ngModel)]="textoBusqueda"
            (ngModelChange)="alEscribirBusqueda($event)"
            (focus)="abrirPanel()" />
        </p-iconField>
      </form>
      <div class="panel-busqueda" *ngIf="panelAbierto">
        <div class="panel-vacio" *ngIf="!textoBusqueda.trim()">
          <p class="panel-subtitulo">Términos más buscados</p>
          <div class="chips-populares">
            <button
              type="button"
              class="chip-termino"
              *ngFor="let termino of terminosPopulares"
              (click)="buscarTermino(termino)">
              {{ termino }}
            </button>
          </div>

          <ng-container *ngIf="busquedasRecientes.length > 0">
            <p class="panel-subtitulo panel-subtitulo-recientes">Últimas búsquedas</p>
            <div class="chips-populares">
              <button
                type="button"
                class="chip-termino chip-reciente"
                *ngFor="let termino of busquedasRecientes"
                (click)="buscarTerminoReciente(termino)">
                {{ termino }}
              </button>
            </div>
          </ng-container>
        </div>

        <div class="panel-cargando" *ngIf="textoBusqueda.trim() && buscando">
          <span class="pi pi-spin pi-spinner"></span>
          Buscando productos...
        </div>
        <div class="panel-resultados" *ngIf="textoBusqueda.trim() && !buscando && resultados.length > 0">
          <p class="panel-subtitulo">Listado de productos</p>

          <div
            class="resultado-item resultado-clicable"
            *ngFor="let producto of resultados"
            role="button"
            tabindex="0"
            (click)="irADetalle(producto)"
            (keydown.enter)="irADetalle(producto)">
            <div class="resultado-imagen" [class.sin-imagen]="!producto.imagenUrl">
              <img *ngIf="producto.imagenUrl" [src]="producto.imagenUrl" [alt]="producto.nombre" loading="lazy" />
              <span *ngIf="!producto.imagenUrl" class="pi pi-shopping-basket"></span>
            </div>

            <div class="resultado-info">
              <p class="resultado-nombre">{{ producto.nombre }}</p>
              <p class="resultado-precio">S/ {{ producto.precio.toFixed(2) }}</p>
            </div>

            <button
              type="button"
              class="resultado-boton-agregar"
              [class.agregado]="productoRecienAgregadoId === producto.id"
              [disabled]="producto.stock <= 0"
              (click)="agregarRapido(producto, $event)">
              <span *ngIf="productoRecienAgregadoId !== producto.id">
                {{ producto.stock > 0 ? 'Agregar' : 'Agotado' }}
              </span>
              <span *ngIf="productoRecienAgregadoId === producto.id">
                <span class="pi pi-check"></span> Agregado
              </span>
            </button>
          </div>

          <button type="button" class="panel-ver-todos" (click)="verTodosLosResultados()">
            Ver todos los productos ({{ totalResultados }})
          </button>
        </div>

        <div class="panel-sin-resultados" *ngIf="textoBusqueda.trim() && !buscando && resultados.length === 0">
          <span class="pi pi-search"></span>
          <p>No encontramos productos para "{{ textoBusqueda }}"</p>
        </div>
      </div>
    </div>

    <div class="buscador-overlay" *ngIf="panelAbierto" (click)="cerrarPanel()"></div>

    <div class="bloque-derecho">
 <nav class="nav-tienda">
  <a routerLink="/mi-pedido" routerLinkActive="activo" class="enlace-usuario">
    <span class="pi pi-box icono-accion"></span>
    <span class="texto-accion">Mis pedidos</span>
  </a>

  <a *ngIf="!clienteAuth.cliente()" routerLink="/login" routerLinkActive="activo" class="enlace-usuario">
    <span class="pi pi-user icono-accion"></span>
    <span class="texto-accion">Mi cuenta</span>
  </a>

  <div *ngIf="clienteAuth.cliente()" class="menu-cuenta" id="menu-cuenta-contenedor">
<button type="button" class="enlace-usuario boton-cuenta" [class.activo]="menuCuentaAbierto" (click)="alternarMenuCuenta()">
  <span class="avatar-iniciales">{{ inicialesCliente }}</span>
  <span class="texto-accion">Hola, {{ primerNombre }}</span>
  <span class="pi pi-chevron-down flecha-cuenta" [class.girada]="menuCuentaAbierto"></span>
</button>

    <div class="dropdown-cuenta" *ngIf="menuCuentaAbierto">
      <a routerLink="/mi-cuenta" class="dropdown-item" (click)="cerrarMenuCuenta()">
        <span class="pi pi-user"></span> Mi cuenta
      </a>
      <a routerLink="/mis-direcciones" class="dropdown-item" (click)="cerrarMenuCuenta()">
        <span class="pi pi-map-marker"></span> Mis direcciones
      </a>
      <button type="button" class="dropdown-item dropdown-item-salir" (click)="cerrarSesion()">
        <span class="pi pi-sign-out"></span> Cerrar sesión
      </button>
    </div>
  </div>
</nav>

      <div class="carrito-contenedor">
        <button class="enlace-carrito" [class.activo]="carrito.abierto()" title="Carrito" (click)="alPresionarCarrito()">
          <span class="pi pi-shopping-cart"></span>
          <span class="carrito-badge" *ngIf="carrito.totalItems() > 0">{{ carrito.totalItems() }}</span>
        </button>
      </div>
    </div>

  </div>
</header>
